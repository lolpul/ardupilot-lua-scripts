name: Lua checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Parse published Lua files
        run: find modules scripts tests -name '*.lua' -print0 | xargs -0 -n1 luac5.3 -p
      - name: Run behavioral and mocked-binding tests
        run: lua5.3 tests/run.lua
  lua-float32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build checksum-verified Lua 5.3.5 with 32-bit numbers
        run: |
          mkdir -p .local
          curl --fail --silent --show-error https://www.lua.org/ftp/lua-5.3.5.tar.gz -o .local/lua-5.3.5.tar.gz
          echo '0c2eed3f960446e1a3e4b9a1ca2f3ff893b6ce41942cf54d5dd59ab4b3b058ac  .local/lua-5.3.5.tar.gz' | sha256sum --check
          tar -xzf .local/lua-5.3.5.tar.gz -C .local
          make -C .local/lua-5.3.5 generic MYCFLAGS=-DLUA_32BITS -j2
      - name: Run float32 behavioral checks
        run: .local/lua-5.3.5/src/lua tests/run.lua
